    <path d="M706 49c35 68 22 199 20 349l87-31c-44-104-36-205 14-318Z" fill="#315f68" stroke="#27434a" stroke-width="8"/>
    <path d="M1102 49c-26 102-29 224 5 349l78-25c-31-130-18-229-5-324Z" fill="#315f68" stroke="#27434a" stroke-width="8"/>
    <g transform="translate(806 192)">
      <ellipse cx="0" cy="0" rx="34" ry="23" fill="#e36f58" stroke="#27434a" stroke-width="6"/>
      <circle cx="28" cy="-14" r="18" fill="#e36f58" stroke="#27434a" stroke-width="6"/>
      <path d="m47-14 25 9-25 10Z" fill="#f2bb4d" stroke="#27434a" stroke-width="5"/>
