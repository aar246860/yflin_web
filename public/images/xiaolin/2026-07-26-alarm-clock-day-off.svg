<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">鬧鐘向枕頭請了一天假</title>
  <desc id="desc">晨光照進藍綠色臥室，橘色鬧鐘把摺好的請假單交給戴眼鏡的枕頭；床邊拖鞋、窗台小鳥、冒氣水杯與探頭的小林一起旁觀。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dbece8"/>
      <stop offset="1" stop-color="#eef4ef"/>
    </linearGradient>
    <linearGradient id="sunbeam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffe89a" stop-opacity=".86"/>
      <stop offset="1" stop-color="#ffe89a" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#263f46" flood-opacity=".2"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wall)"/>
  <rect y="604" width="1200" height="196" fill="#d2aa78"/>
  <path d="M0 657c199-31 367 32 560 1s390-42 640 5" fill="none" stroke="#b98c5d" stroke-width="6" opacity=".45"/>

  <!-- Window, curtains, bird and morning light -->
