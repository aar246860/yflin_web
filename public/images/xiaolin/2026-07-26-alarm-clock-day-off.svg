      <path d="M-14 20-24 40m42-18 8 20" stroke="#27434a" stroke-width="5" stroke-linecap="round"/>
    </g>
  </g>
  <path d="M970 378 575 664h459Z" fill="url(#sunbeam)"/>
  <g stroke="#f4c45d" stroke-width="7" stroke-linecap="round" opacity=".78">
    <path d="M1045 97 1082 60M1080 142h54M1037 190l43 39M959 77l-10-52"/>
