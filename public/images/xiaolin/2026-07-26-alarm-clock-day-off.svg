  <g transform="translate(1030 568)" filter="url(#shadow)">
    <circle cx="56" cy="47" r="44" fill="#edc7a5" stroke="#27434a" stroke-width="8"/>
    <path d="M15 46C20 8 49-13 86 9c17 10 20 32 13 51-12-16-26-27-41-36-10 15-26 23-43 22Z" fill="#27434a"/>
    <circle cx="43" cy="50" r="4" fill="#27434a"/><circle cx="72" cy="47" r="4" fill="#27434a"/>
    <path d="M46 67c11 5 20 4 28-4" fill="none" stroke="#27434a" stroke-width="5" stroke-linecap="round"/>
    <path d="M6 104c29-25 78-26 104 0l21 117H-13Z" fill="#4d8790" stroke="#27434a" stroke-width="8"/>
    <path d="M26 133-21 161m103-25 58 17" stroke="#27434a" stroke-width="10" stroke-linecap="round"/>
  </g>

  <!-- Quiet motion marks -->
  <g fill="none" stroke="#27434a" stroke-width="6" stroke-linecap="round">
    <path d="M398 362c-15-25-35-38-59-41m275 58c20-24 43-35 69-34"/>
    <path d="M682 346c18-22 40-31 67-30"/>
  </g>
</svg>

