  <title id="title">今晚的風沒有附說明書</title>
  <desc id="desc">半開的窗戶面向深藍夜色。青綠窗簾向室內飄動，遠方公寓亮著幾扇窗，月亮、機車尾燈、塑膠袋和金屬碰撞符號散落在風的路徑上；小林坐在窗邊聆聽。</desc>
