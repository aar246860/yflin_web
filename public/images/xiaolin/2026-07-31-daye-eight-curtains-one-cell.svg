    <circle cx="377" cy="69" r="45" fill="#6ee7a2" opacity=".25" filter="url(#glow)"/>
    <circle cx="377" cy="69" r="22" fill="#8df0b4"/>
    <circle cx="377" cy="69" r="7" fill="#effff4"/>
