<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">三張椅子的1190視線測試</title>
  <desc id="desc">深藍色遊戲室裡，A椅正對計分板，B椅透過斜鏡觀看，C椅位於黑色遮板後。重置中的1190只沿金色與青色視線抵達A和B，右側正式比分牌顯示大野1420分。</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071f2b"/>
      <stop offset="1" stop-color="#103d45"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102d38"/>
      <stop offset="1" stop-color="#06141d"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="80" height="80" patternUnits="userSpaceOnUse">
      <path d="M80 0H0V80" fill="none" stroke="#76b8b2" stroke-opacity=".12" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#room)"/>
  <rect x="40" y="40" width="1520" height="820" rx="34" fill="url(#grid)" stroke="#8cc9be" stroke-opacity=".38" stroke-width="3"/>

  <g aria-label="重置中的計分板">
    <rect x="105" y="105" width="650" height="255" rx="22" fill="#030c12" stroke="#d7b76a" stroke-width="5"/>
    <rect x="138" y="138" width="584" height="189" rx="13" fill="url(#screen)" stroke="#456e72" stroke-width="3"/>
    <path d="M170 180H690M170 230H690M170 280H690" stroke="#6eaaa5" stroke-opacity=".2" stroke-width="2"/>
    <text x="185" y="190" fill="#8cc9be" font-size="26" font-family="system-ui, sans-serif" letter-spacing="5">RESET / FIRST FLASH</text>
    <text x="255" y="290" fill="#eef0ca" fill-opacity=".52" font-size="118" font-family="ui-monospace, monospace" font-weight="700" letter-spacing="22" filter="url(#glow)">1190</text>
    <rect x="440" y="116" width="82" height="226" fill="#d9d6ca" fill-opacity=".08" stroke="#e8e1cb" stroke-opacity=".45" stroke-dasharray="9 9"/>
    <text x="458" y="335" fill="#d8c887" font-size="17" font-family="system-ui, sans-serif">第二窗</text>
  </g>

  <g aria-label="三條觀察路徑">
    <path d="M420 360L350 635" fill="none" stroke="#e0b85c" stroke-width="8" stroke-linecap="round" stroke-dasharray="17 15"/>
    <circle cx="420" cy="360" r="9" fill="#e0b85c"/>
    <path d="M610 360L825 505L1030 665" fill="none" stroke="#79d2ca" stroke-width="8" stroke-linecap="round" stroke-dasharray="17 15"/>
    <circle cx="610" cy="360" r="9" fill="#79d2ca"/>
    <path d="M690 360L1260 665" fill="none" stroke="#667981" stroke-width="8" stroke-linecap="round" stroke-dasharray="17 15"/>
    <path d="M1120 470L1260 735" fill="none" stroke="#111a20" stroke-width="42" stroke-linecap="round"/>
  </g>

  <g aria-label="B椅前的斜鏡" transform="translate(805 455) rotate(-18)">
    <rect x="0" y="0" width="54" height="210" rx="9" fill="#b7e7e0" fill-opacity=".3" stroke="#a4e0d8" stroke-width="5"/>
    <path d="M15 18V190" stroke="#edf8ef" stroke-opacity=".72" stroke-width="7"/>
  </g>

  <g aria-label="A椅" transform="translate(250 620)">
    <rect x="0" y="0" width="200" height="78" rx="20" fill="#c69235" stroke="#f2cc73" stroke-width="5"/>
    <path d="M28 78V165M172 78V165" stroke="#e3bc68" stroke-width="18" stroke-linecap="round"/>
    <rect x="38" y="-58" width="124" height="65" rx="17" fill="#8b6228" stroke="#f2cc73" stroke-width="5"/>
    <circle cx="100" cy="38" r="32" fill="#102e37" stroke="#f5dd9a" stroke-width="4"/>
    <text x="88" y="50" fill="#f5dd9a" font-size="34" font-family="system-ui, sans-serif" font-weight="700">A</text>
    <text x="53" y="205" fill="#f5dd9a" font-size="26" font-family="system-ui, sans-serif">正面</text>
  </g>

  <g aria-label="B椅" transform="translate(930 650)">
    <rect x="0" y="0" width="200" height="78" rx="20" fill="#387f80" stroke="#83d6ce" stroke-width="5"/>
    <path d="M28 78V165M172 78V165" stroke="#6cc0bb" stroke-width="18" stroke-linecap="round"/>
    <rect x="38" y="-58" width="124" height="65" rx="17" fill="#225d61" stroke="#83d6ce" stroke-width="5"/>
    <circle cx="100" cy="38" r="32" fill="#102e37" stroke="#b0eee7" stroke-width="4"/>
    <text x="88" y="50" fill="#b0eee7" font-size="34" font-family="system-ui, sans-serif" font-weight="700">B</text>
    <text x="52" y="205" fill="#b0eee7" font-size="26" font-family="system-ui, sans-serif">鏡面</text>
  </g>

  <g aria-label="C椅與遮板" transform="translate(1210 650)">
    <rect x="-70" y="-215" width="270" height="200" rx="15" fill="#071016" stroke="#52636b" stroke-width="5"/>
    <path d="M-50 -185H180M-50 -150H180M-50 -115H180" stroke="#52636b" stroke-opacity=".5" stroke-width="3"/>
    <text x="0" y="-62" fill="#82949b" font-size="23" font-family="system-ui, sans-serif">遮板背面：空白</text>
    <rect x="0" y="0" width="200" height="78" rx="20" fill="#46575d" stroke="#82949b" stroke-width="5"/>
    <path d="M28 78V165M172 78V165" stroke="#71858c" stroke-width="18" stroke-linecap="round"/>
    <circle cx="100" cy="38" r="32" fill="#102e37" stroke="#aab8bc" stroke-width="4"/>
    <text x="88" y="50" fill="#cbd5d7" font-size="34" font-family="system-ui, sans-serif" font-weight="700">C</text>
    <text x="53" y="205" fill="#aab8bc" font-size="26" font-family="system-ui, sans-serif">遮蔽</text>
  </g>

  <g aria-label="正式比分牌" transform="translate(1010 90)">
    <rect width="460" height="270" rx="24" fill="#efe5c8" stroke="#d5a64d" stroke-width="5"/>
    <text x="38" y="55" fill="#553c2c" font-size="24" font-family="system-ui, sans-serif" letter-spacing="3">OFFICIAL MATCH 07</text>
    <text x="38" y="113" fill="#8a3f34" font-size="38" font-family="system-ui, sans-serif" font-weight="700">大野 / DAYE</text>
    <text x="38" y="214" fill="#183f47" font-size="104" font-family="ui-monospace, monospace" font-weight="800">1420</text>
    <text x="323" y="236" fill="#8a6a44" font-size="20" font-family="system-ui, sans-serif">PREDICT</text>
  </g>

  <g aria-hidden="true">
    <circle cx="350" cy="610" r="13" fill="#f0ca70" filter="url(#glow)"/>
    <circle cx="1030" cy="640" r="13" fill="#85ded6" filter="url(#glow)"/>
    <circle cx="1260" cy="640" r="13" fill="#62737a"/>
  </g>
</svg>
