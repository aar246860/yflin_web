<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">小林把四位數顯示模組放到桌面</title>
  <desc id="desc">深藍遊戲室中，A位置白卡與B位置計分板空槽保持空白，C位置桌上的四位數模組顯示1190，下方記錄小林本回合1454分。</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07172f"/>
      <stop offset="0.58" stop-color="#102f4d"/>
      <stop offset="1" stop-color="#071225"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#183f56"/>
      <stop offset="1" stop-color="#081823"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="9" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#room)"/>
  <g stroke="#315a73" stroke-width="2" opacity="0.42">
    <path d="M0 170H1600M0 340H1600M0 510H1600M0 680H1600"/>
    <path d="M220 0V900M440 0V900M660 0V900M880 0V900M1100 0V900M1320 0V900"/>
  </g>
  <text x="84" y="88" fill="#d8e8ee" font-family="system-ui, sans-serif" font-size="29" letter-spacing="5">ROOM 02 · COMPONENT TEST</text>
  <text x="84" y="130" fill="#78ccb9" font-family="system-ui, sans-serif" font-size="23">ONE FRAME · ONE WINDOW · ONE CABLE</text>

  <g transform="translate(90 230)">
    <text x="0" y="-28" fill="#f1c56f" font-family="system-ui, sans-serif" font-size="38" font-weight="700">A</text>
    <rect width="310" height="270" rx="18" fill="#dce1e4" stroke="#f4f0e4" stroke-width="7"/>
    <rect x="28" y="30" width="254" height="208" rx="10" fill="#eef1ef"/>
    <path d="M28 134H282M155 30V238" stroke="#c6ced1" stroke-width="3"/>
    <text x="58" y="178" fill="#7a8790" font-family="system-ui, sans-serif" font-size="24">WHITE CARD</text>
    <text x="76" y="211" fill="#7a8790" font-family="system-ui, sans-serif" font-size="21">NO DIGITS</text>
  </g>

  <g transform="translate(470 205)">
    <text x="0" y="-28" fill="#f1c56f" font-family="system-ui, sans-serif" font-size="38" font-weight="700">B</text>
    <rect width="520" height="320" rx="22" fill="#173d52" stroke="#7fcfbd" stroke-width="8"/>
    <rect x="34" y="36" width="452" height="248" rx="12" fill="url(#screen)"/>
    <g stroke="#2e6171" stroke-width="3">
      <path d="M34 118H486M34 202H486M185 36V284M335 36V284"/>
    </g>
    <rect x="218" y="215" width="238" height="50" rx="6" fill="#040b12" stroke="#547383" stroke-width="4"/>
    <text x="244" y="249" fill="#708795" font-family="system-ui, sans-serif" font-size="20" letter-spacing="2">EMPTY SLOT</text>
  </g>

  <g transform="translate(1080 300)">
    <text x="0" y="-82" fill="#f1c56f" font-family="system-ui, sans-serif" font-size="38" font-weight="700">C</text>
    <path d="M-94 124H-32C8 124 2 16 42 16H82" fill="none" stroke="#a6b8c2" stroke-width="14" stroke-linecap="round"/>
    <path d="M-94 124H-32C8 124 2 16 42 16H82" fill="none" stroke="#637d8c" stroke-width="3" stroke-dasharray="12 10"/>
    <rect x="72" y="-42" width="390" height="150" rx="18" fill="#112d40" stroke="#e08d51" stroke-width="8"/>
    <rect x="100" y="-14" width="334" height="94" rx="10" fill="url(#screen)"/>
    <text x="136" y="55" fill="#91f1c7" font-family="ui-monospace, monospace" font-size="72" font-weight="700" letter-spacing="11" filter="url(#glow)">1190</text>
    <path d="M34 112H490L430 208H-28Z" fill="#173247" stroke="#3d667c" stroke-width="4"/>
    <text x="112" y="190" fill="#a9c9d2" font-family="system-ui, sans-serif" font-size="22">FOUR-DIGIT MODULE · FIRST FLASH</text>
  </g>

  <g transform="translate(85 735)">
    <rect width="1430" height="112" rx="24" fill="#091a2d" stroke="#355d73" stroke-width="3"/>
    <text x="40" y="46" fill="#a9c9d2" font-family="system-ui, sans-serif" font-size="24" letter-spacing="3">OFFICIAL MATCH · XIAOLIN · RISK</text>
    <text x="1188" y="78" fill="#f1c56f" font-family="ui-monospace, monospace" font-size="72" font-weight="700">1454</text>
    <text x="40" y="82" fill="#78ccb9" font-family="system-ui, sans-serif" font-size="23">A blank · B slot dark · 1190 appeared once at C</text>
  </g>
</svg>
