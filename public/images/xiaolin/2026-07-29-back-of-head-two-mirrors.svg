  <g transform="translate(625 490) scale(.62) translate(-625 -750)">
  <g clip-path="url(#p6)">
    <rect x="625" y="750" width="530" height="305" fill="#a8cbc5"/>
    <rect x="625" y="986" width="530" height="69" fill="#7d938b"/>
