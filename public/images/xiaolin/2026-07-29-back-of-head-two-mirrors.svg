    <text x="657" y="438" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#21474d">4</text>
  </g>
  <rect x="625" y="398" width="530" height="305" rx="18" fill="none" stroke="#193f46" stroke-width="7"/>
  </g>

  <!-- Panel 5: cape lifts and hair moves -->
  <g transform="translate(245 490) scale(.62) translate(-45 -750)">
  <g clip-path="url(#p5)">
