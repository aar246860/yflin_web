    <rect x="95" y="80" width="330" height="230" rx="8" fill="url(#glass)" stroke="#254e55" stroke-width="8"/>
    <line x1="260" y1="80" x2="260" y2="310" stroke="#254e55" stroke-width="7"/>
    <rect x="442" y="93" width="42" height="155" rx="20" fill="#f4eee4" stroke="#254e55" stroke-width="6"/>
    <path d="M448 100l30 20-30 22 30 22-30 22 30 22-30 24" fill="none" stroke="#d85c4a" stroke-width="12"/>
