<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
  <title id="title">後腦勺只在兩面鏡子之間出現</title>
  <desc id="desc">六格彩色漫畫：小林走進理髮店、披上圍巾、看著落髮，接著透過手鏡與牆鏡看見後腦勺，最後走出店外用手確認剛修短的髮尾。</desc>
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f5f1e9"/>
      <stop offset="1" stop-color="#dce8e3"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b9d8d9" stop-opacity=".85"/>
      <stop offset="1" stop-color="#6f9fa1" stop-opacity=".42"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#163d44" flood-opacity=".16"/>
    </filter>
    <clipPath id="p1"><rect x="45" y="45" width="530" height="305" rx="18"/></clipPath>
    <clipPath id="p2"><rect x="625" y="45" width="530" height="305" rx="18"/></clipPath>
    <clipPath id="p3"><rect x="45" y="398" width="530" height="305" rx="18"/></clipPath>
    <clipPath id="p4"><rect x="625" y="398" width="530" height="305" rx="18"/></clipPath>
    <clipPath id="p5"><rect x="45" y="750" width="530" height="305" rx="18"/></clipPath>
    <clipPath id="p6"><rect x="625" y="750" width="530" height="305" rx="18"/></clipPath>
  </defs>

  <rect width="1200" height="850" fill="#f8faf7"/>

