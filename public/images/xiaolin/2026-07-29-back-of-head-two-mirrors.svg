    <circle cx="657" cy="782" r="20" fill="#f0b54c"/>
    <text x="657" y="790" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#21474d">6</text>
  </g>
  <rect x="625" y="750" width="530" height="305" rx="18" fill="none" stroke="#193f46" stroke-width="7"/>
