<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">迴紋針接管了桌面交通</title>
  <desc id="desc">木質桌面上，一枚戴橘色紙帽的迴紋針指揮鉛筆、橡皮擦與便利貼通過紙張道路和直尺高架橋，小林從筆記本後探頭觀看。</desc>
  <defs>
    <pattern id="wood" width="150" height="36" patternUnits="userSpaceOnUse">
      <rect width="150" height="36" fill="#e9d6b6"/>
      <path d="M0 9C35 3 76 16 150 7M0 28c44-8 91 7 150-2" fill="none" stroke="#cfad7d" stroke-width="3" opacity=".55"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#38464a" flood-opacity=".22"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#wood)"/>
  <path d="M0 650C210 622 365 677 568 646S980 616 1200 655v145H0Z" fill="#d4b27f" opacity=".34"/>

  <!-- Paper roadway -->
  <g filter="url(#shadow)">
    <path d="M72 535 368 430 1092 446 1118 660 482 676Z" fill="#f8f5ec" stroke="#253b41" stroke-width="7" stroke-linejoin="round"/>
    <path d="M120 554 442 472 1065 490" fill="none" stroke="#e5a33e" stroke-width="10" stroke-dasharray="34 27" stroke-linecap="round"/>
    <path d="M447 629 1088 613" fill="none" stroke="#78b8b4" stroke-width="8" stroke-dasharray="24 20"/>
  </g>

  <!-- Ruler bridge -->
  <g transform="rotate(-7 622 397)" filter="url(#shadow)">
    <rect x="378" y="354" width="520" height="76" rx="10" fill="#f5c75d" stroke="#253b41" stroke-width="7"/>
    <path d="M420 354v28m42-28v17m42-17v28m42-28v17m42-17v28m42-28v17m42-17v28m42-28v17m42-17v28m42-28v17m42-17v28" stroke="#253b41" stroke-width="5"/>
    <path d="M430 430v47m402-47v47" stroke="#253b41" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Coffee-cup roundabout -->
  <g transform="translate(934 154)" filter="url(#shadow)">
    <ellipse cx="90" cy="145" rx="85" ry="26" fill="#8e6d4d" opacity=".24"/>
    <path d="M19 28h142l-13 114c-3 25-22 41-47 41H78c-25 0-44-16-47-41Z" fill="#f6efe0" stroke="#253b41" stroke-width="8"/>
    <path d="M161 61h29c55 0 55 76 4 82h-37" fill="none" stroke="#253b41" stroke-width="12"/>
    <ellipse cx="90" cy="28" rx="71" ry="24" fill="#765139" stroke="#253b41" stroke-width="8"/>
    <path d="M66-3c-20-27 18-35 3-63m50 64c-19-28 20-34 7-64" fill="none" stroke="#f8f5ec" stroke-width="10" stroke-linecap="round" opacity=".72"/>
    <path d="M-29 198c62-31 183-30 237 4" fill="none" stroke="#e36c55" stroke-width="9" stroke-dasharray="18 18"/>
  </g>

  <!-- Pencil traffic -->
  <g transform="translate(127 467) rotate(-16)" filter="url(#shadow)">
    <path d="M0 0h289l57 27-57 27H0Z" fill="#5ea7a3" stroke="#253b41" stroke-width="7"/>
    <path d="m289 0 57 27-57 27 14-27Z" fill="#f0d2aa" stroke="#253b41" stroke-width="7"/>
    <path d="M0 0h40v54H0Z" fill="#e36c55" stroke="#253b41" stroke-width="7"/>
    <circle cx="88" cy="65" r="13" fill="#253b41"/><circle cx="249" cy="65" r="13" fill="#253b41"/>
  </g>
  <g transform="translate(176 600) rotate(-4)" filter="url(#shadow)">
    <path d="M0 0h242l50 24-50 24H0Z" fill="#e5a33e" stroke="#253b41" stroke-width="7"/>
    <path d="m242 0 50 24-50 24 12-24Z" fill="#f0d2aa" stroke="#253b41" stroke-width="7"/>
    <path d="M0 0h36v48H0Z" fill="#dc7184" stroke="#253b41" stroke-width="7"/>
    <circle cx="78" cy="59" r="12" fill="#253b41"/><circle cx="210" cy="59" r="12" fill="#253b41"/>
  </g>

  <!-- Eraser bus -->
  <g transform="translate(680 534) rotate(2)" filter="url(#shadow)">
    <rect width="220" height="116" rx="22" fill="#ef8b98" stroke="#253b41" stroke-width="8"/>
    <path d="M112 4v108" stroke="#f8f5ec" stroke-width="9"/>
    <rect x="22" y="20" width="63" height="35" rx="8" fill="#bfe1df" stroke="#253b41" stroke-width="5"/>
    <circle cx="50" cy="123" r="17" fill="#253b41"/><circle cx="173" cy="123" r="17" fill="#253b41"/>
  </g>

  <!-- Sticky-note sign -->
  <g transform="translate(872 364) rotate(5)" filter="url(#shadow)">
    <path d="M0 0h190v148l-35-26-37 27-37-27-38 26-43-29Z" fill="#ffe685" stroke="#253b41" stroke-width="7"/>
    <path d="M33 44h124M33 76h94" stroke="#253b41" stroke-width="8" stroke-linecap="round"/>
    <path d="M92 149v92" stroke="#253b41" stroke-width="10"/>
    <path d="m57 240 35-48 35 48Z" fill="#e36c55" stroke="#253b41" stroke-width="7"/>
  </g>

  <!-- Paperclip traffic officer -->
  <g transform="translate(548 418)" filter="url(#shadow)">
    <path d="M65 32C32 7 4 34 22 67l52 96c19 35 73 17 55-20L77 47c-6-12-25-7-19 7l45 84c5 10-9 18-15 7L42 58c-13-24 13-44 34-25" fill="none" stroke="#dce4e3" stroke-width="19" stroke-linecap="round"/>
    <path d="M65 32C32 7 4 34 22 67l52 96c19 35 73 17 55-20L77 47c-6-12-25-7-19 7l45 84c5 10-9 18-15 7L42 58c-13-24 13-44 34-25" fill="none" stroke="#253b41" stroke-width="7" stroke-linecap="round"/>
    <path d="m10 13 45-24 42 25-15 25H30Z" fill="#e36c55" stroke="#253b41" stroke-width="7"/>
    <path d="M42 90 4 128m91-44 45-25" stroke="#253b41" stroke-width="9" stroke-linecap="round"/>
    <circle cx="3" cy="129" r="12" fill="#e5a33e" stroke="#253b41" stroke-width="5"/>
    <circle cx="142" cy="58" r="12" fill="#5ea7a3" stroke="#253b41" stroke-width="5"/>
  </g>

  <!-- Notebook and Xiaolin -->
  <g transform="translate(35 74)" filter="url(#shadow)">
    <path d="M0 38 332 0l42 278-332 38Z" fill="#355a62" stroke="#253b41" stroke-width="8"/>
    <path d="M40 61 298 31l28 188-259 31Z" fill="#f8f5ec"/>
    <path d="M75 100h173M79 137h206M84 174h137" stroke="#9fb0ae" stroke-width="7" stroke-linecap="round"/>
    <g transform="translate(245 178)">
      <circle cx="52" cy="43" r="39" fill="#edc7a5" stroke="#253b41" stroke-width="7"/>
      <path d="M16 42C22 4 47-13 82 8c17 10 18 33 13 48-12-14-22-23-37-34-12 17-27 24-42 20Z" fill="#253b41"/>
      <circle cx="40" cy="47" r="4" fill="#253b41"/><circle cx="68" cy="44" r="4" fill="#253b41"/>
      <path d="M45 62c11 8 20 5 27-2" fill="none" stroke="#253b41" stroke-width="5" stroke-linecap="round"/>
      <path d="M9 91c30-23 67-23 93 0l14 59H-7Z" fill="#5ea7a3" stroke="#253b41" stroke-width="7"/>
    </g>
  </g>

  <!-- Small navigation details -->
  <g fill="none" stroke="#253b41" stroke-width="6" stroke-linecap="round">
    <path d="M499 704c41 25 94 25 139-3"/>
    <path d="m628 681 17 19-23 10"/>
    <path d="M1007 707c28-23 59-24 92-7"/>
  </g>
  <circle cx="474" cy="700" r="10" fill="#e36c55"/>
  <circle cx="1110" cy="703" r="10" fill="#5ea7a3"/>
</svg>
