<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">1190只在第二個小窗裡</title>
  <desc id="desc">四格漫畫依序顯示重置前的空白計分板、第一閃時淡淡出現的1190、第三閃後恢復空白，以及本回合正式分數1308。</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2eee4"/>
      <stop offset="1" stop-color="#dfeae6"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#12384d"/>
      <stop offset="1" stop-color="#061827"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="13" stdDeviation="11" flood-color="#0a1922" flood-opacity=".28"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#2c5967" opacity=".16"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#page)"/>
  <rect width="1600" height="900" fill="url(#dots)"/>
  <path d="M0 112 H1600" stroke="#244d57" stroke-width="3"/>
  <text x="76" y="72" fill="#173a43" font-family="sans-serif" font-size="38" font-weight="700">1190只在第二個小窗裡</text>
  <text x="1524" y="70" text-anchor="end" fill="#b75c42" font-family="sans-serif" font-size="20" letter-spacing="4">ROOM TURN 06 · XIAOLIN</text>

  <g transform="translate(65 165)" filter="url(#shadow)">
    <rect width="340" height="520" rx="14" fill="#f9f5ea" stroke="#173a43" stroke-width="5"/>
    <rect x="28" y="56" width="284" height="260" rx="13" fill="url(#screen)" stroke="#5d8790" stroke-width="3"/>
    <path d="M54 114 H286 M54 170 H286 M54 226 H286 M112 82 V290 M170 82 V290 M228 82 V290" stroke="#75a7ad" stroke-opacity=".18" stroke-width="2"/>
    <rect x="54" y="226" width="116" height="48" rx="5" fill="#020b13" opacity=".72"/>
    <text x="170" y="368" text-anchor="middle" fill="#173a43" font-family="sans-serif" font-size="26" font-weight="700">重置以前</text>
    <text x="170" y="409" text-anchor="middle" fill="#547179" font-family="sans-serif" font-size="18">只有藍色格線</text>
    <circle cx="170" cy="466" r="17" fill="none" stroke="#c78643" stroke-width="4"/>
    <text x="170" y="474" text-anchor="middle" fill="#9e5b2f" font-family="sans-serif" font-size="22">1</text>
  </g>

  <g transform="translate(440 165)" filter="url(#shadow)">
    <rect width="340" height="520" rx="14" fill="#fff8e8" stroke="#c56b3f" stroke-width="7"/>
    <rect x="28" y="56" width="284" height="260" rx="13" fill="url(#screen)" stroke="#df9a54" stroke-width="4"/>
    <path d="M54 114 H286 M54 170 H286 M54 226 H286 M112 82 V290 M170 82 V290 M228 82 V290" stroke="#75a7ad" stroke-opacity=".18" stroke-width="2"/>
    <text x="170" y="238" text-anchor="middle" fill="#d6e8df" fill-opacity=".42" font-family="sans-serif" font-size="74" font-weight="700" filter="url(#glow)">1190</text>
    <text x="170" y="368" text-anchor="middle" fill="#9e4f32" font-family="sans-serif" font-size="26" font-weight="700">第一閃</text>
    <text x="170" y="409" text-anchor="middle" fill="#7f6250" font-family="sans-serif" font-size="18">四個淡筆畫</text>
    <circle cx="170" cy="466" r="23" fill="#c56b3f"/>
    <text x="170" y="475" text-anchor="middle" fill="#fff8e8" font-family="sans-serif" font-size="25" font-weight="700">2</text>
    <path d="M122 499 Q170 472 218 499" fill="none" stroke="#c56b3f" stroke-width="5" stroke-linecap="round"/>
  </g>

  <g transform="translate(815 165)" filter="url(#shadow)">
    <rect width="340" height="520" rx="14" fill="#f9f5ea" stroke="#173a43" stroke-width="5"/>
    <rect x="28" y="56" width="284" height="260" rx="13" fill="url(#screen)" stroke="#5d8790" stroke-width="3"/>
    <path d="M54 114 H286 M54 170 H286 M54 226 H286 M112 82 V290 M170 82 V290 M228 82 V290" stroke="#75a7ad" stroke-opacity=".18" stroke-width="2"/>
    <path d="M60 279 H280" stroke="#7ea2aa" stroke-opacity=".28" stroke-width="3"/>
    <text x="170" y="368" text-anchor="middle" fill="#173a43" font-family="sans-serif" font-size="26" font-weight="700">第三閃以後</text>
    <text x="170" y="409" text-anchor="middle" fill="#547179" font-family="sans-serif" font-size="18">數字沒有回來</text>
    <circle cx="170" cy="466" r="17" fill="none" stroke="#c78643" stroke-width="4"/>
    <text x="170" y="474" text-anchor="middle" fill="#9e5b2f" font-family="sans-serif" font-size="22">3</text>
  </g>

  <g transform="translate(1190 165)" filter="url(#shadow)">
    <rect width="340" height="520" rx="14" fill="#0b2738" stroke="#3d7780" stroke-width="5"/>
    <text x="34" y="66" fill="#80b6ba" font-family="sans-serif" font-size="18" letter-spacing="4">OFFICIAL SCORE</text>
    <line x1="34" y1="92" x2="306" y2="92" stroke="#35636c"/>
    <text x="34" y="142" fill="#ebb668" font-family="sans-serif" font-size="23">XIAOLIN / 小林</text>
    <text x="170" y="272" text-anchor="middle" fill="#fff4d8" font-family="sans-serif" font-size="94" font-weight="700" filter="url(#glow)">1308</text>
    <text x="170" y="316" text-anchor="middle" fill="#77aab0" font-family="monospace" font-size="15">d147c52dbb82cbba</text>
    <line x1="34" y1="352" x2="306" y2="352" stroke="#35636c"/>
    <text x="170" y="405" text-anchor="middle" fill="#bfd5d5" font-family="sans-serif" font-size="20">預測 · 一次正式結果</text>
    <rect x="58" y="448" width="224" height="38" rx="19" fill="#163e4d"/>
    <text x="170" y="474" text-anchor="middle" fill="#f1c379" font-family="sans-serif" font-size="18">大野領先 817</text>
  </g>

  <g transform="translate(80 760)">
    <path d="M0 0 H690" stroke="#173a43" stroke-width="3"/>
    <text x="0" y="48" fill="#173a43" font-family="sans-serif" font-size="24">我知道它出現在哪一格。</text>
    <text x="0" y="84" fill="#b75c42" font-family="sans-serif" font-size="24" font-weight="700">還不知道它從哪裡來。</text>
  </g>
  <g transform="translate(1040 773)">
    <path d="M0 0 q38 -36 76 0 q38 36 76 0" fill="none" stroke="#c56b3f" stroke-width="5" stroke-linecap="round"/>
    <text x="174" y="8" fill="#547179" font-family="sans-serif" font-size="19">SECOND WINDOW / 未命名</text>
  </g>
</svg>
