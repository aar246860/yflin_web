<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">末班車前的豆花店</title>
  <desc id="desc">夜色中的車站出口旁，一碗豆花放在小圓桌上，旁邊有紅色塑膠椅、綠色湯匙、沾到糖水的收據、玻璃門與即將進站的列車燈光。</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#17233b"/>
      <stop offset="1" stop-color="#34506a"/>
    </linearGradient>
    <linearGradient id="station" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#dce7e7"/>
      <stop offset="1" stop-color="#91a7a8"/>
    </linearGradient>
    <linearGradient id="syrup" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a86731"/>
      <stop offset="1" stop-color="#5c321e"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="13"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#night)"/>
  <circle cx="1030" cy="105" r="46" fill="#f4e8bb"/>
  <path d="M0 530L1200 465V800H0Z" fill="#293843"/>
